name: Release

# Builds the CSS and publishes it as an immutable, tagged release for jsDelivr.
#
# The tag points at a release commit that is NOT on any branch: it is the
# selected branch's HEAD plus the compiled dist/ (force-added; dist/ stays in
# .gitignore). main never contains build output, and an existing tag is never
# moved or overwritten.
#
# Run from the Actions tab ("Release" → "Run workflow") or:
#   gh workflow run release.yml -f version=v1.2.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v1.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      REPO: ${{ github.repository }}
    steps:
      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like v1.2.0 (got '$VERSION')"; exit 1
          fi

      - uses: actions/checkout@v4

      - name: Refuse to overwrite an existing tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists. Released tags are immutable; pick a new version."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build   # also runs the dist URL check

      - name: Compute SRI hashes and release notes
        run: |
          base="https://cdn.jsdelivr.net/gh/$REPO@$VERSION"
          {
            echo "## jsDelivr"
            echo
            for f in dist/css/main.css dist/css/checkout.css dist/css/main.expanded.css dist/css/checkout.expanded.css; do
              hash="sha384-$(openssl dgst -sha384 -binary "$f" | openssl base64 -A)"
              echo "**\`$f\`**"
              echo
              echo '```html'
              echo "<link rel=\"stylesheet\" href=\"$base/$f\" integrity=\"$hash\" crossorigin=\"anonymous\">"
              echo '```'
              echo
            done
            echo "Built from \`${GITHUB_SHA::7}\` on \`$GITHUB_REF_NAME\`."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Create release commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898281+github-actions[bot]@users.noreply.github.com"
          git add -f dist/css
          git commit -m "Release $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
