<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Azari SCSS Template</title>
    <link rel="stylesheet" href="dist/css/main.css" />
    <style>
      .demo > * > div, .demo.grid > div { background: #f8f8f8; border: 1px solid #d8d8d8; padding: 1rem; }
    </style>
  </head>
  <body>
    <main class="container py-5">
      <h1>Azari SCSS Template</h1>

      <h2 class="mt-5">Grid (row / col)</h2>
      <div class="row g-3 demo">
        <div class="col-12 col-md-6 col-lg-4"><div>col-12 col-md-6 col-lg-4</div></div>
        <div class="col-12 col-md-6 col-lg-4"><div>col-12 col-md-6 col-lg-4</div></div>
        <div class="col-12 col-lg-4"><div>col-12 col-lg-4</div></div>
      </div>

      <h2 class="mt-5">CSS Grid</h2>
      <div class="grid demo">
        <div class="g-col-6 g-col-md-4">g-col-6 g-col-md-4</div>
        <div class="g-col-6 g-col-md-4">g-col-6 g-col-md-4</div>
        <div class="g-col-12 g-col-md-4">g-col-12 g-col-md-4</div>
      </div>

      <h2 class="mt-5">Flexbox utilities</h2>
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3 demo">
        <div><div>d-flex</div></div>
        <div><div>justify-content-between</div></div>
        <div><div>gap-3</div></div>
      </div>
    </main>
  </body>
</html>
